<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DrainWatch map view of civic issues" />
    <title>DrainWatch | Map view</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="map">
    <div class="site-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">D</div>
          <div>
            <strong>DrainWatch</strong>
            <span>Urban flow intelligence</span>
          </div>
        </div>

        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="reports.html">Report</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="map.html" class="active">Map</a>
          <a href="teams.html">Teams</a>
        </nav>

        <a class="button primary" href="reports.html">Submit issue</a>
      </header>

      <main class="page-shell">
        <section class="page-header">
          <div>
            <span class="eyebrow">Operations map</span>
            <h1>Live civic issue map</h1>
          </div>
          <span class="status-pill neutral">Issued by ward</span>
        </section>

        <section class="map-panel glass-panel">
          <div class="map-grid">
            <div class="map-surface">
              <div class="map-road"></div>
              <div class="map-road"></div>
              <div class="map-road"></div>
              <div class="map-pin pin-1"></div>
              <div class="map-pin pin-2"></div>
              <div class="map-pin pin-3"></div>
              <div class="map-pin pin-4"></div>
              <div class="map-pin pin-5"></div>
            </div>

            <aside class="map-legend">
              <div class="legend-card">
                <strong>Ward 12 · Riverside</strong>
                <p>2 open issues</p>
              </div>
              <div class="legend-card">
                <strong>Ward 18 · Greenfield</strong>
                <p>1 escalation</p>
              </div>
              <div class="legend-card">
                <strong>Ward 06 · Old Town</strong>
                <p>3 open issues</p>
              </div>
              <div class="legend-card">
                <strong>Ward 21 · Hillside</strong>
                <p>1 resolved issue</p>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
